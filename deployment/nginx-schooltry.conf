server {
    listen 80;
    listen [::]:80;
    server_name schooltry.example.com;

    root /var/www/schooltry/current/public;
    index index.php;
    autoindex off;
    server_tokens off;

    client_max_body_size 12m;
    client_body_timeout 30s;
    send_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_connect_timeout 10s;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.env(?:$|/) {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_log /var/log/nginx/schooltry-error.log warn;
    access_log /var/log/nginx/schooltry-access.log;
}
